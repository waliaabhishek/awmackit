name: PowerTools
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

packages:
  LinkRouterCore:
    path: Packages/LinkRouterCore

targets:
  PowerTools:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PowerTools
      - path: BrowserExtensions/PowerToolsLinkRouter/dist
        name: BrowserExtension
        type: folder
        buildPhase: resources
    dependencies:
      - package: LinkRouterCore
      - target: PowerToolsSafariExtension
        embed: true
      - target: PowerToolsShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhi.PowerTools
        PRODUCT_NAME: PowerTools
        INFOPLIST_FILE: Config/PowerTools-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/PowerTools.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CLANG_ENABLE_MODULES: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - PowerToolsTests

  PowerToolsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PowerToolsTests
    dependencies:
      - target: PowerTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhi.PowerTools.Tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PowerTools.app/Contents/MacOS/PowerTools"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PowerToolsSafariExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Extensions/SafariWebExtension
      - path: BrowserExtensions/PowerToolsLinkRouter/common
        name: SharedWebExtensionResources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhi.PowerTools.LinkRouter.SafariExtension
        PRODUCT_NAME: PowerToolsSafariExtension
        INFOPLIST_FILE: Config/SafariWebExtension-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/SafariWebExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0

  PowerToolsShareExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Extensions/ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhi.PowerTools.LinkRouter.ShareExtension
        PRODUCT_NAME: PowerToolsShareExtension
        INFOPLIST_FILE: Config/ShareExtension-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/ShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
